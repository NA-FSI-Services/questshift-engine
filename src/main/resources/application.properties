quarkus.application.name=questshift-engine
quarkus.http.port=8080
quarkus.http.cors=true
quarkus.http.cors.origins=*
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=*

quarkus.smallrye-openapi.info-title=QuestShift Engine
quarkus.smallrye-openapi.info-version=0.1.0
quarkus.swagger-ui.always-include=true

# vLLM OpenAI-compatible endpoint. Override in OpenShift ConfigMap
# or untracked application-local.properties (see quarkus.config.locations).
# Product freeze: ibm-granite/granite-3.2-8b-instruct. Committed api-key stays none.
questshift.llm.base-url=http://questshift-llm:8000/v1
questshift.llm.model=ibm-granite/granite-3.2-8b-instruct
questshift.llm.api-key=none
questshift.llm.enabled=true
questshift.llm.timeout-seconds=45

# Sibling clone in local multi-root workspace; ConfigMap mount in cluster.
questshift.campaigns.dir=../questshift-campaigns/campaigns
questshift.campaigns.default-id=devops-dungeon

%test.questshift.llm.enabled=false
%dev.questshift.llm.enabled=false

# Optional gitignored overlay. Missing file is ignored. Use %dev.* keys so %test stays LLM-off.
quarkus.config.locations=application-local.properties

# Packaged @QuarkusIntegrationTest uses the test profile (LLM off).
quarkus.test.integration-test-profile=test
